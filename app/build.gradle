plugins {
    id 'com.android.application'
}

android {
    namespace 'com.antarmakan.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.antarmakan.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Sengaja TANPA library tambahan (hanya Android SDK bawaan)
    // agar mudah di-build di CodeAssist / AIDE.
}
