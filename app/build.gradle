plugins {
    id 'com.android.application'
}

android {
    namespace 'com.antarmakan.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.antarmakan.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Kunci tanda tangan tetap, agar SHA-1 tidak berubah (dibutuhkan login Google).
    // Sebelum upload ke Play Store, buat kunci rilis sendiri yang dirahasiakan.
    signingConfigs {
        antarmakan {
            storeFile file('antarmakan.keystore')
            storePassword 'antarmakan123'
            keyAlias 'antarmakan'
            keyPassword 'antarmakan123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.antarmakan
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.antarmakan
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Login dengan Google (Credential Manager)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
