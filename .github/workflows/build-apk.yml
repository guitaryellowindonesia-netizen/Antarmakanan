name: Build APK AntarMakan

on:
  push:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK (debug, siap install)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AntarMakan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AntarMakan-apk
          path: AntarMakan.apk

      - name: Terbitkan ke halaman Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          name: AntarMakan APK (build terbaru)
          body: APK terbaru hasil build otomatis. Unduh file AntarMakan.apk lalu install di HP Android.
          prerelease: true
          files: AntarMakan.apk
